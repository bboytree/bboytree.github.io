<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bala Nature Scrapbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
</head>

<body>

  <nav class="navbar">
    <a href="index.html">About</a>
    <a href="photos.html"><strong>Photos</strong></a>
  </nav>

  <div class="container">

    <h1 class="page-title">Photos</h1>

    <div class="intro">
      <p class="photosintro">
         All photos were shot on a Nikon D60 camera from 2008. I preferred using it over my phone as it was less distracting.
      </p>
    </div>

    <div class="gallery-top-lines"></div>

    <div class="gallery">

      <figure>
        <a href="photos/tigerfly.html">
          <img src="photos/tigerfly.JPG" alt="Tigerfly photo">
          <figcaption>Tigerfly</figcaption>
        </a>
      </figure>

      <figure>
        <a href="photos/soul_piercing.html">
          <img src="photos/soul_piercing.JPG" alt="Soft-Piercing photo">
          <figcaption>Soul-Piercing</figcaption>
        </a>
      </figure>

      <figure>
        <a href="photos/soft_strokes.html">
          <img src="photos/soft_strokes.JPG" alt="Soft Strokes photo">
          <figcaption>Soft Strokes</figcaption>
        </a>
      </figure>

      <figure>
        <a href="photos/post_lunch.html">
          <img src="photos/post_lunch.JPG" alt="Post-Lunch photo">
          <figcaption>Post-Lunch</figcaption>
        </a>
      </figure>

      <figure>
        <a href="photos/ethernal.html">
          <img src="photos/ethernal.JPG" alt="Ethernal photo">
          <figcaption>Ethernal</figcaption>
        </a>
      </figure>

      <figure>
        <a href="photos/rising_sun.html">
          <img src="photos/rising_sun.JPG" alt="Rising Sun photo">
          <figcaption>Rising Sun</figcaption>
        </a>
      </figure>

    </div> <!-- .gallery -->

    <nav class="photo-pagination" aria-label="Photo pages">
      <div class="photo-pagination__row">
        <span aria-hidden="true"></span>
        <span class="photo-pagination__current">PAGE ONE</span>
        <a class="photo-pagination__next" href="photos_page2.html">TURN PAGE</a>
      </div>
    </nav>

  </div><!-- .container -->


  <script>
  document.querySelectorAll('.gallery img').forEach(img => {
    if (img.complete) {
      img.classList.add('loaded');
    } else {
      img.onload = () => img.classList.add('loaded');
    }
  });
</script>

</body>
</html>
